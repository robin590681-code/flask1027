
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生資料管理系統</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1, h2 {
            color: #24476b;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            background-color: #3776ab;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #3776ab;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f5f9;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>學生資料管理系統</h1>

    <h2>新增學生資料</h2>

    <form action="{{ url_for('add_student') }}" method="POST">

        <label for="name">姓名（name）</label>
        <input type="text" id="name" name="name"
               placeholder="請輸入學生姓名" required>

        <label for="student_id">學號（student_id）</label>
        <input type="text" id="student_id" name="student_id"
               placeholder="請輸入學生學號" required>

        <label for="department">科系（department）</label>
        <input type="text" id="department" name="department"
               placeholder="請輸入學生科系" required>

        <button type="submit">新增學生</button>

    </form>

    <h2>學生資料列表</h2>

    <table>
        <thead>
            <tr>
                <th>姓名</th>
                <th>學號</th>
                <th>科系</th>
            </tr>
        </thead>

        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.student_id }}</td>
                <td>{{ student.department }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3">目前沒有學生資料</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
</body>
</html>
